<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Notes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%234f46e5'/%3E%3Crect x='16' y='16' width='32' height='6' rx='3' fill='white'/%3E%3Crect x='16' y='29' width='32' height='6' rx='3' fill='white'/%3E%3Crect x='16' y='42' width='22' height='6' rx='3' fill='white'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --text: #1f2328; --muted: #667085; --faint: #98a2b3;
  --line: #e4e7ec; --line-strong: #d0d5dd; --hover: #f2f4f7;
  --accent: #4f46e5; --accent-hover: #4338ca; --accent-soft: #eef2ff; --accent-line: #c7d2fe;
  --ok: #067647; --ok-soft: #ecfdf3; --warn: #b54708; --warn-soft: #fffaeb;
  --bad: #b42318; --bad-soft: #fef3f2; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --radius: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- top bar */
.top { position: sticky; top: 0; z-index: 5; height: 60px; background: var(--panel); border-bottom: 1px solid var(--line);
       display: flex; align-items: center; gap: 16px; padding: 0 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; white-space: nowrap; }
.brand svg { width: 28px; height: 28px; }
.state { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted);
         background: var(--hover); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
.state .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.state.rec { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.state.rec .dot { background: var(--bad); animation: pulse 1.2s infinite; }
.state.busy { background: var(--warn-soft); color: var(--warn); }
.state.busy .dot { background: var(--warn); }
.state.off .dot { background: var(--faint); }
@keyframes pulse { 50% { opacity: .25; } }
.search { margin-left: auto; position: relative; width: min(420px, 45vw); }
.search input { width: 100%; height: 38px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 12px 0 36px; background: var(--panel); }
.search svg { position: absolute; left: 11px; top: 11px; width: 16px; height: 16px; color: var(--faint); }

/* ---------- layout */
.layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; padding: 20px; max-width: 1400px; margin: 0 auto; align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.side { position: sticky; top: 80px; padding: 16px; }
main { min-width: 0; }

/* ---------- calendar */
.cal-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.cal-head .month { flex: 1; font-weight: 650; font-size: 15px; }
.icon-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; width: 32px; height: 32px; display: grid; place-items: center; }
.icon-btn:hover { background: var(--hover); }
.text-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; height: 32px; padding: 0 10px; font-size: 13px; }
.text-btn:hover { background: var(--hover); }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); user-select: none; }
.dow { text-align: center; font-size: 11px; font-weight: 600; color: var(--faint); padding: 6px 0; }
.day { position: relative; height: 40px; border: 0; background: transparent; font-size: 13px; color: var(--text); }
.day span.num { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; }
.day:hover span.num { background: var(--hover); }
.day.out { color: var(--faint); }
.day.today span.num { box-shadow: inset 0 0 0 1.5px var(--accent); font-weight: 650; }
.day.in-range { background: var(--accent-soft); }
.day.in-range.first { border-radius: 20px 0 0 20px; }
.day.in-range.last { border-radius: 0 20px 20px 0; }
.day.in-range.first.last { border-radius: 20px; }
.day.edge span.num, .day.single span.num { background: var(--accent); color: #fff; }
.day .count { position: absolute; top: 2px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
              background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; line-height: 16px; }
.day.edge .count, .day.single .count { background: #fff; color: var(--accent); box-shadow: 0 0 0 1px var(--accent-line); }
.ranges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; }
.chip:hover { background: var(--hover); }
.chip.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); font-weight: 600; }
.hint { font-size: 12px; color: var(--faint); margin-top: 10px; }
.side-foot { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

/* ---------- main content */
.page-head { display: flex; align-items: flex-end; gap: 16px; margin: 4px 0 16px; flex-wrap: wrap; }
.page-head h1 { font-size: 24px; line-height: 1.25; margin: 0; letter-spacing: -.01em; }
.page-head .sub { color: var(--muted); margin-top: 4px; }
.page-head .tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 9px;
       border: 1px solid var(--line-strong); background: var(--panel); font-weight: 550; font-size: 13px; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 15px; height: 15px; }
.section { margin-bottom: 20px; }
.section > h2 { font-size: 13px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.section > h2 .n { background: var(--hover); color: var(--muted); border-radius: 999px; padding: 0 8px; font-size: 12px; letter-spacing: 0; }

.mtg { display: grid; grid-template-columns: 76px 1fr auto; gap: 14px; width: 100%; text-align: left; padding: 14px 16px;
       border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); margin-bottom: 10px; }
.mtg:hover { border-color: var(--accent-line); background: #fcfcff; }
.mtg .time { font-weight: 650; font-variant-numeric: tabular-nums; }
.mtg .dur { color: var(--muted); font-size: 12px; }
.mtg .title { font-weight: 650; font-size: 15px; }
.mtg .meta { color: var(--muted); font-size: 12.5px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.mtg .topics { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.mtg .right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.pill { font-size: 11.5px; font-weight: 650; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.pill.recording { background: var(--bad-soft); color: var(--bad); }
.pill.processing { background: var(--warn-soft); color: var(--warn); }
.pill.failed { background: var(--bad-soft); color: var(--bad); }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.plain { background: var(--hover); color: var(--muted); }

.empty { text-align: center; color: var(--muted); padding: 40px 20px; }
.empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

/* action items */
.actions { padding: 6px 0; }
.act { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: start; padding: 10px 16px; border-top: 1px solid var(--line); }
.act:first-child { border-top: 0; }
.act input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); cursor: pointer; }
.act .what { font-weight: 500; }
.act.done .what { text-decoration: line-through; color: var(--faint); }
.act .who { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.act .from { font-size: 12px; color: var(--accent); background: none; border: 0; padding: 0; text-align: right; }
.act .from:hover { text-decoration: underline; }
.owner-me { color: var(--accent); font-weight: 600; }
.toggle-done { font-size: 12.5px; color: var(--muted); background: none; border: 0; padding: 8px 16px; }

textarea.notes { width: 100%; min-height: 160px; resize: vertical; border: 1px solid var(--line-strong); border-radius: 10px; padding: 12px; background: var(--panel); line-height: 1.55; }
.save-state { font-size: 12px; color: var(--faint); height: 18px; margin-top: 4px; }

/* ---------- meeting detail */
.back { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; margin-bottom: 10px; display: inline-flex; align-items: center; gap: 4px; }
.banner { border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; display: flex; gap: 12px; align-items: center; }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner .btn { margin-left: auto; }
.people { padding: 14px 16px; margin-bottom: 16px; }
.people-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.people-head b { font-size: 15px; }
.people-head span { color: var(--muted); font-size: 12.5px; }
.person { display: grid; grid-template-columns: 12px 200px 1fr; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.person:first-of-type { border-top: 0; }
.person .sw { width: 12px; height: 12px; border-radius: 50%; }
.person input { width: 100%; height: 34px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 10px; background: var(--panel); }
.person .info { font-size: 12.5px; color: var(--muted); min-width: 0; }
.person .info q { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.badge { font-size: 11px; font-weight: 650; border-radius: 6px; padding: 1px 6px; margin-right: 6px; }
.badge.voice { background: var(--ok-soft); color: var(--ok); }
.badge.sugg { background: var(--accent-soft); color: var(--accent); }
.people-foot { display: flex; justify-content: flex-end; margin-top: 10px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tab { border: 0; background: none; padding: 10px 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--text); }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.doc { padding: 8px 24px 20px; }
.md h2 { font-size: 17px; margin: 22px 0 8px; }
.md h3 { font-size: 15px; margin: 18px 0 6px; }
.md ul { padding-left: 20px; margin: 6px 0; }
.md li { margin: 3px 0; }
.md p { margin: 8px 0; }
.md table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
.md th, .md td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--hover); }
.md code { background: var(--hover); padding: 1px 5px; border-radius: 5px; }
.tr { padding: 6px 8px; }
.tr-line { display: grid; grid-template-columns: 70px 140px 1fr; gap: 10px; padding: 8px 12px; border-radius: 8px; }
.tr-line:hover { background: var(--hover); }
.tr-time { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; }
.tr-who { font-weight: 650; font-size: 13px; overflow-wrap: anywhere; }

.results .res { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
.results .res:hover { border-color: var(--accent-line); }
.results .res .t { font-weight: 650; }
.results .res .s { color: var(--muted); font-size: 13px; margin-top: 3px; }
.results mark { background: #fef08a; border-radius: 3px; padding: 0 1px; }

.toast { position: fixed; right: 20px; bottom: 20px; background: #1f2328; color: #fff; padding: 10px 14px; border-radius: 10px;
         font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.18); opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; z-index: 10; }
.toast.show { opacity: 1; transform: none; }

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; padding: 12px; }
  .side { position: static; }
  .top { gap: 10px; padding: 0 12px; }
  .state { display: none; }
  .search { width: 100%; }
  .person { grid-template-columns: 12px 1fr; }
  .person .info { grid-column: 2; }
  .tr-line { grid-template-columns: 56px 1fr; }
  .tr-line .tr-text { grid-column: 1 / -1; }
  .mtg { grid-template-columns: 60px 1fr; }
  .mtg .right { grid-column: 1 / -1; flex-direction: row; align-items: center; }
}

/* ---------- print / PDF */
body.print { background: #fff; font-size: 11pt; }
body.print .pdoc { max-width: 760px; margin: 0 auto; padding: 24px; }
body.print .pdoc + .pdoc { break-before: page; }
body.print h1 { font-size: 20pt; margin: 0 0 4px; }
body.print .pmeta { color: var(--muted); margin-bottom: 14px; }
@media print { .top, .layout, .toast { display: none !important; } body { background: #fff; } }
</style>
</head>
<body>
<header class="top" id="top">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="4" width="56" height="56" rx="14" fill="#4f46e5"/><rect x="16" y="16" width="32" height="6" rx="3" fill="#fff"/><rect x="16" y="29" width="32" height="6" rx="3" fill="#fff"/><rect x="16" y="42" width="22" height="6" rx="3" fill="#fff"/></svg>
    Meeting Notes
  </div>
  <div class="state off" id="state"><span class="dot"></span><span id="state-text">Connecting...</span></div>
  <label class="search">
    <span class="sr">Search all meetings</span>
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg>
    <input id="q" type="search" placeholder="Search all meetings, notes and transcripts" autocomplete="off">
  </label>
</header>

<div class="layout" id="layout">
  <aside class="card side" aria-label="Calendar">
    <div class="cal-head">
      <button class="icon-btn" id="prev" aria-label="Previous month">&#8249;</button>
      <div class="month" id="month"></div>
      <button class="icon-btn" id="next" aria-label="Next month">&#8250;</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="ranges" id="ranges">
      <button class="chip" data-range="today">Today</button>
      <button class="chip" data-range="yesterday">Yesterday</button>
      <button class="chip" data-range="week">This week</button>
      <button class="chip" data-range="last7">Last 7 days</button>
      <button class="chip" data-range="month">This month</button>
      <button class="chip" data-range="all">All</button>
    </div>
    <div class="hint">Click a day, or drag across days to pick a range.</div>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
// ===================================================================== helpers
const $ = (s, r = document) => r.querySelector(s);
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { "X-Notetaker": "1", ...(opts.headers || {}) } });
const fmtDay = (s, opts = { weekday: "long", day: "numeric", month: "long", year: "numeric" }) => parseYmd(s).toLocaleDateString(undefined, opts);
const fmtShort = (s) => fmtDay(s, { weekday: "short", day: "numeric", month: "short" });
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const fmtMins = (sec) => sec >= 60 ? `${Math.round(sec / 60)} min` : `${sec}s`;
const COLORS = ["#0e7490", "#c2410c", "#be185d", "#15803d", "#7c3aed", "#a16207", "#1d4ed8", "#9f1239"];
function colorFor(id) { if (id === "ME") return "#4f46e5"; const n = parseInt(String(id).replace(/\D/g, "")) || 0; return COLORS[n % COLORS.length]; }
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600); }
const ICON = {
  word: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 2h7l4 4v12H5z"/><path d="M8 10l1 5 1.5-3.5L12 15l1-5"/></svg>',
  pdf: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 2h7l4 4v12H5z"/><path d="M8 11h4M8 14h4"/></svg>',
  copy: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="7" width="10" height="11" rx="2"/><path d="M13 7V4a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
  folder: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 5a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/></svg>',
};

// ===================================================================== markdown (escape first, then add markup)
function inline(s) {
  return s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(src) {
  const lines = src.replace(/\r/g, "").split("\n");
  let html = "", i = 0;
  const isBlock = (l) => /^(#{1,4}\s|\s*\||\s*[-*]\s|\s*\d+\.\s)/.test(l);
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (h) { html += `<h${h[1].length}>${inline(esc(h[2]))}</h${h[1].length}>`; i++; continue; }
    if (/^\s*\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = (r) => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
      html += "<table>" + rows.filter((r) => !/^\s*\|?\s*:?-{3,}/.test(r)).map((r, k) =>
        "<tr>" + cells(r).map((c) => k === 0 ? `<th>${inline(esc(c))}</th>` : `<td>${inline(esc(c))}</td>`).join("") + "</tr>").join("") + "</table>";
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const tag = /^\s*\d+\.\s/.test(l) ? "ol" : "ul";
      html += `<${tag}>`;
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) html += `<li>${inline(esc(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, "")))}</li>`;
      html += `</${tag}>`;
      continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !isBlock(lines[i])) para.push(lines[i++]);
    html += `<p>${inline(esc(para.join(" ")))}</p>`;
  }
  return html;
}
// Minutes body without the title line and the action-items table (both shown separately).
function minutesBody(notes) {
  return notes.replace(/^# .*\n?/m, "").replace(/\n## Action Items[\s\S]*?(?=\n## |\s*$)/, "\n");
}

// ===================================================================== state
const S = {
  meetings: [], status: null, view: new Date(), sel: new Set([ymd(new Date())]), range: "today",
  meetingId: null, meeting: null, tab: "minutes", showDone: false, query: "", results: null,
};
S.view.setDate(1);

function selectionDays() { return [...S.sel].sort(); }
function rangeSet(a, b) {
  let [x, y] = [parseYmd(a), parseYmd(b)]; if (x > y) [x, y] = [y, x];
  const out = new Set(); for (const d = new Date(x); d <= y; d.setDate(d.getDate() + 1)) out.add(ymd(d)); return out;
}
function meetingsInSelection() { return S.meetings.filter((m) => S.sel.has(m.date)).sort((a, b) => a.id.localeCompare(b.id)); }

// ===================================================================== status bar
function renderStatus() {
  const el = $("#state"), st = S.status;
  el.className = "state";
  if (!st) { el.classList.add("off"); $("#state-text").textContent = "Not connected"; return; }
  if (st.recording) {
    el.classList.add("rec");
    const secs = Math.max(0, Math.round((Date.now() - new Date(st.since).getTime()) / 1000));
    $("#state-text").textContent = `Recording Teams call · ${Math.floor(secs / 60)}:${pad(secs % 60)}`;
  } else if (st.processing) { el.classList.add("busy"); $("#state-text").textContent = "Writing minutes..."; }
  else if (st.watching) { $("#state-text").textContent = "Watching for Teams calls"; }
  else { el.classList.add("off"); $("#state-text").textContent = "Not recording calls (open Meeting Notes from the Start menu)"; }
}

// ===================================================================== calendar
let dragFrom = null, dragged = false;
function renderCalendar() {
  $("#month").textContent = S.view.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const counts = {}; for (const m of S.meetings) counts[m.date] = (counts[m.date] || 0) + 1;
  const start = new Date(S.view); start.setDate(1 - ((S.view.getDay() + 6) % 7));
  const today = ymd(new Date()), days = selectionDays();
  const contiguous = days.length > 1 && rangeSet(days[0], days[days.length - 1]).size === days.length;
  let html = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"].map((d) => `<div class="dow">${d}</div>`).join("");
  for (let k = 0; k < 42; k++) {
    const d = new Date(start); d.setDate(start.getDate() + k);
    const key = ymd(d), n = counts[key] || 0, sel = S.sel.has(key);
    const cls = ["day"];
    if (d.getMonth() !== S.view.getMonth()) cls.push("out");
    if (key === today) cls.push("today");
    if (sel && S.sel.size === 1) cls.push("single");
    else if (sel) {
      cls.push("in-range");
      const prev = new Date(d); prev.setDate(d.getDate() - 1); const next = new Date(d); next.setDate(d.getDate() + 1);
      if (!S.sel.has(ymd(prev)) || d.getDay() === 1) cls.push("first");
      if (!S.sel.has(ymd(next)) || d.getDay() === 0) cls.push("last");
      if (contiguous && (key === days[0] || key === days[days.length - 1])) cls.push("edge");
    }
    html += `<button class="${cls.join(" ")}" data-day="${key}" aria-pressed="${sel}" aria-label="${fmtDay(key)}${n ? ", " + plural(n, "meeting") : ""}">` +
            `<span class="num">${d.getDate()}</span>${n ? `<span class="count">${n}</span>` : ""}</button>`;
  }
  $("#grid").innerHTML = html;
  document.querySelectorAll("#ranges .chip").forEach((c) => c.classList.toggle("on", c.dataset.range === S.range));
  const total = S.meetings.length;
  $("#side-foot").textContent = total ? `${plural(total, "meeting")} recorded in total.` : "No meetings recorded yet.";
}
function selectDays(set, range = null) {
  S.sel = set; S.range = range; S.meetingId = null; S.meeting = null; S.query = ""; $("#q").value = "";
  history.replaceState(null, "", location.pathname);
  renderCalendar(); renderMain();
}
$("#grid").addEventListener("mousedown", (e) => {
  const b = e.target.closest("[data-day]"); if (!b || e.button !== 0) return;
  if (e.ctrlKey || e.metaKey) { const s = new Set(S.sel); s.has(b.dataset.day) ? s.delete(b.dataset.day) : s.add(b.dataset.day); if (s.size) selectDays(s); return; }
  if (e.shiftKey && S.sel.size) { selectDays(rangeSet(selectionDays()[0], b.dataset.day)); return; }
  dragFrom = b.dataset.day; dragged = false; e.preventDefault();
});
$("#grid").addEventListener("mouseover", (e) => {
  const b = e.target.closest("[data-day]"); if (!dragFrom || !b) return;
  if (b.dataset.day !== dragFrom) dragged = true;
  S.sel = rangeSet(dragFrom, b.dataset.day); S.range = null; renderCalendar();
});
document.addEventListener("mouseup", (e) => {
  if (!dragFrom) return;
  const b = e.target.closest && e.target.closest("[data-day]");
  if (!dragged) selectDays(new Set([dragFrom]), dragFrom === ymd(new Date()) ? "today" : null);
  else selectDays(S.sel);
  dragFrom = null;
  if (b && b.classList.contains("out")) { S.view = parseYmd(b.dataset.day); S.view.setDate(1); renderCalendar(); }
});
$("#grid").addEventListener("keydown", (e) => {
  const b = e.target.closest("[data-day]"); if (b && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); selectDays(new Set([b.dataset.day])); }
});
$("#prev").onclick = () => { S.view.setMonth(S.view.getMonth() - 1); renderCalendar(); };
$("#next").onclick = () => { S.view.setMonth(S.view.getMonth() + 1); renderCalendar(); };
document.querySelectorAll("#ranges .chip").forEach((c) => c.onclick = () => {
  const now = new Date(), t = ymd(now), r = c.dataset.range;
  const back = (n) => { const d = new Date(now); d.setDate(d.getDate() - n); return ymd(d); };
  let set;
  if (r === "today") set = new Set([t]);
  if (r === "yesterday") set = new Set([back(1)]);
  if (r === "week") { const mon = back((now.getDay() + 6) % 7); const sun = new Date(parseYmd(mon)); sun.setDate(sun.getDate() + 6); set = rangeSet(mon, ymd(sun)); }
  if (r === "last7") set = rangeSet(back(6), t);
  if (r === "month") set = rangeSet(ymd(new Date(now.getFullYear(), now.getMonth(), 1)), ymd(new Date(now.getFullYear(), now.getMonth() + 1, 0)));
  if (r === "all") set = S.meetings.length ? rangeSet(S.meetings[0].date, S.meetings[S.meetings.length - 1].date) : new Set([t]);
  S.view = new Date(now.getFullYear(), now.getMonth(), 1);
  selectDays(set, r);
});

// ===================================================================== main view router
function renderMain() {
  if (S.query) return renderSearch();
  if (S.meetingId) return renderMeeting();
  return renderOverview();
}
function exportButtons(ids) {
  const dis = ids.length ? "" : "disabled";
  return `<button class="btn" data-export="docx" data-ids="${ids.join(",")}" ${dis}>${ICON.word} Word</button>` +
         `<button class="btn" data-export="pdf" data-ids="${ids.join(",")}" ${dis}>${ICON.pdf} PDF</button>`;
}
function selectionTitle() {
  const days = selectionDays();
  if (days.length === 1) return fmtDay(days[0]);
  const contiguous = rangeSet(days[0], days[days.length - 1]).size === days.length;
  if (contiguous) return `${fmtDay(days[0], { day: "numeric", month: "short" })} – ${fmtDay(days[days.length - 1], { day: "numeric", month: "short", year: "numeric" })}`;
  return plural(days.length, "selected day");
}

// ---------- overview of the selected days
function actionRow(m, a, showFrom) {
  const mine = S.status && a.owner === S.status.my_name;
  return `<div class="act ${a.done ? "done" : ""}">
    <input type="checkbox" ${a.done ? "checked" : ""} data-act="${m.id}:${a.i}" aria-label="Mark done: ${esc(a.action)}">
    <div><div class="what">${inline(esc(a.action))}</div>
      <div class="who"><span class="${mine ? "owner-me" : ""}">${esc(a.owner || "Unassigned")}</span>${a.due && a.due !== "-" ? " · due " + esc(a.due) : ""}</div></div>
    ${showFrom ? `<button class="from" data-open="${m.id}">${esc(m.title || "Teams meeting")}</button>` : "<span></span>"}
  </div>`;
}
function renderOverview() {
  const ms = meetingsInSelection(), days = selectionDays();
  const ready = ms.filter((m) => m.status === "ready").map((m) => m.id);
  const acts = ms.flatMap((m) => m.actions.map((a) => [m, a]));
  const open = acts.filter(([, a]) => !a.done);
  const shown = S.showDone ? acts : open;
  let html = `<div class="page-head"><div><h1>${esc(selectionTitle())}</h1>
      <div class="sub">${plural(ms.length, "meeting")}${acts.length ? ` · ${open.length} open of ${plural(acts.length, "action item")}` : ""}</div></div>

  html += `<div class="section"><h2>Meetings <span class="n">${ms.length}</span></h2>`;
  if (!ms.length) {
    html += `<div class="card empty"><b>No meetings ${days.length === 1 ? "on this day" : "in these days"}</b>
      Minutes are taken automatically when you join a Teams call while Meeting Notes is running.</div>`;
  }
  for (const m of ms) {
    const done = m.actions.filter((a) => a.done).length;
    const pill = m.status === "recording" ? '<span class="pill recording">Recording now</span>'
      : m.status === "processing" ? '<span class="pill processing">Writing minutes...</span>'

    html += `<button class="mtg" data-open="${m.id}">
      <div><div class="time">${m.start}</div><div class="dur">${m.duration_min ? m.duration_min + " min" : ""}</div></div>
      <div style="min-width:0"><div class="title">${esc(m.title || (m.status === "ready" ? "Teams meeting" : "Teams call"))}</div>
        <div class="meta">${days.length > 1 ? `<span>${fmtShort(m.date)}</span>` : ""}${m.people.length ? `<span>With ${esc(m.people.join(", "))}</span>` : ""}${m.unnamed_speakers ? `<span>${plural(m.unnamed_speakers, "unnamed speaker")}</span>` : ""}${m.has_my_notes ? "<span>Has your notes</span>" : ""}</div>
        ${m.topics.length ? `<div class="topics">${esc(m.topics.slice(0, 4).join(" · "))}</div>` : ""}</div>
      <div class="right">${pill}</div></button>`;
  }
  html += `</div>`;

  if (acts.length) {
    html += `<div class="section"><h2>${S.showDone ? "All action items" : "Open action items"} <span class="n">${shown.length}</span></h2>
      <div class="card actions">${shown.length ? shown.map(([m, a]) => actionRow(m, a, true)).join("") : '<div class="empty" style="padding:20px">All done.</div>'}
      <button class="toggle-done" id="toggle-done">${S.showDone ? "Hide completed" : `Show completed (${acts.length - open.length})`}</button></div></div>`;
  }
  if (days.length === 1) {

  }

let dayTimer;
async function loadDayNotes(day) {
  const ta = $("#daynotes"); if (!ta) return;
  const r = await api(`/api/days/${day}`); if (!r.ok) return;

  ta.oninput = () => {

}

// ---------- single meeting
async function openMeeting(id, tab = "minutes") {
  S.meetingId = id; S.tab = tab; S.query = ""; $("#q").value = "";
  history.replaceState(null, "", "#" + id);
  const m = S.meetings.find((x) => x.id === id);
  if (m && !S.sel.has(m.date)) { S.sel = new Set([m.date]); S.range = null; S.view = parseYmd(m.date); S.view.setDate(1); renderCalendar(); }
  await loadMeeting();
  window.scrollTo({ top: 0 });
}
async function loadMeeting() {
  const r = await api(`/api/meetings/${S.meetingId}`);
  if (!r.ok) { S.meetingId = null; return renderMain(); }
  S.meeting = await r.json();
  renderMeeting();
}
function renderMeeting() {
  const m = S.meeting; if (!m) return;
  const days = selectionDays();
  let html = `<button class="back" id="back">&#8249; ${days.length === 1 ? esc(fmtShort(days[0])) : "All selected days"}</button>
    <div class="page-head"><div><h1>${esc(m.title || "Teams meeting")}</h1>
      <div class="sub">${esc(fmtDay(m.date))} · ${m.start}${m.end ? "–" + m.end : ""}${m.duration_min ? " · " + m.duration_min + " min" : ""}</div></div>
      <div class="tools">${m.notes ? `<button class="btn" id="copy">${ICON.copy} Copy minutes</button>` : ""}
        ${m.notes ? exportButtons([m.id]) : ""}<button class="btn" id="folder" title="Open the meeting's folder">${ICON.folder}</button></div></div>`;
  if (m.status === "failed") html += `<div class="banner bad"><span>${esc(m.error || "Processing failed")}</span><button class="btn" id="retry">Try again</button></div>`;
  if (m.status === "processing") html += `<div class="banner warn">Transcribing and writing the minutes. This page updates by itself.</div>`;
  if (m.status === "recording") html += `<div class="banner bad">This call is being recorded right now. Minutes appear a minute or two after you leave.</div>`;

  const nameable = (m.speakers || []).filter((p) => p.nameable);
  if (nameable.length) {
    html += `<div class="card people"><div class="people-head"><b>People in this meeting</b>
      <span>Name a voice once and it's recognized in future meetings.</span></div>`;
    for (const p of m.speakers) {
      const value = p.name || p.suggested || "";
      const badge = p.auto ? '<span class="badge voice">Recognized by voice</span>' : p.suggested && !p.name ? '<span class="badge sugg">Suggested from the conversation</span>' : "";
      const ph = p.id === "ME" ? "Your name" : `Name for Speaker ${p.id.slice(1)}`;
      html += `<div class="person"><span class="sw" style="background:${colorFor(p.id)}"></span>
        ${p.nameable ? `<input data-speaker="${p.id}" value="${esc(value)}" data-orig="${esc(p.id === "ME" ? (p.name || "") : (p.name || ""))}" placeholder="${esc(ph)}" aria-label="${esc(ph)}">` : `<b>${esc(p.label)}</b>`}
        <div class="info">${badge}${p.id === "ME" ? "You" : esc(p.label)} · talked ${fmtMins(p.seconds)}${p.sample ? `<q>${esc(p.sample)}</q>` : ""}</div></div>`;
    }
    html += `<div class="people-foot"><button class="btn primary" id="save-names" disabled>Save names and update minutes</button></div></div>`;
  }

  const acts = m.actions || [];
  const tabs = [["minutes", "Minutes"], ["actions", `Action items${acts.length ? ` (${acts.filter((a) => !a.done).length})` : ""}`], ["transcript", "Transcript"], ["mynotes", "My notes"]];
  html += `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab ${S.tab === k ? "on" : ""}" role="tab" aria-selected="${S.tab === k}" data-tab="${k}">${l}</button>`).join("")}</div>`;
  if (S.tab === "minutes") html += m.notes ? `<div class="card doc md">${md(minutesBody(m.notes))}</div>` : `<div class="card empty"><b>No minutes yet</b>They're written a minute or two after the call ends.</div>`;
  if (S.tab === "actions") html += acts.length ? `<div class="card actions">${acts.map((a) => actionRow(m, a, false)).join("")}</div>` : `<div class="card empty"><b>No action items</b>Nothing was assigned in this meeting.</div>`;
  if (S.tab === "transcript") html += m.transcript ? `<div class="card tr">${transcriptHtml(m)}</div>` : `<div class="card empty"><b>No transcript yet</b></div>`;
  if (S.tab === "mynotes") html += `<label class="sr" for="mynotes">My notes</label><textarea class="notes" id="mynotes" style="min-height:320px" placeholder="Your own notes for this meeting. They're saved automatically and included in exports.">${esc(m.my_notes || "")}</textarea><div class="save-state" id="mynotes-state"></div>`;
  $("#main").innerHTML = html;

}
function transcriptHtml(m) {
  const byLabel = {}; for (const p of m.speakers || []) byLabel[p.label] = p.id;
  const rows = m.transcript.replace(/\r/g, "").split("\n").map((l) => l.match(/^\[(\d\d:\d\d:\d\d)\] \*\*(.+?):\*\* (.*)$/)).filter(Boolean);
  if (!rows.length) return `<div class="md">${md(m.transcript)}</div>`;
  return rows.map(([, t, who, text]) => `<div class="tr-line"><div class="tr-time">${t}</div>
    <div class="tr-who" style="color:${colorFor(byLabel[who] ?? (who === (S.status && S.status.my_name) ? "ME" : who))}">${esc(who)}</div><div class="tr-text">${esc(text)}</div></div>`).join("");
}
let noteTimer;
function wireMeeting(m) {
  $("#back").onclick = () => { S.meetingId = null; S.meeting = null; history.replaceState(null, "", location.pathname); renderMain(); };
  document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { S.tab = b.dataset.tab; renderMeeting(); });
  const copy = $("#copy"); if (copy) copy.onclick = async () => { await navigator.clipboard.writeText(m.notes); toast("Minutes copied. Paste them into Teams, Outlook or Word."); };
  $("#folder").onclick = () => api(`/api/meetings/${m.id}/open-folder`, { method: "POST" });
  const retry = $("#retry"); if (retry) retry.onclick = async () => { await api(`/api/meetings/${m.id}/retry`, { method: "POST" }); toast("Trying again..."); await refreshData(true); };
  const inputs = [...document.querySelectorAll("[data-speaker]")], save = $("#save-names");
  const dirty = () => inputs.some((i) => i.value.trim() !== i.dataset.orig);
  inputs.forEach((i) => { i.oninput = () => { save.disabled = !dirty(); }; i.onkeydown = (e) => { if (e.key === "Enter" && dirty()) save.click(); }; });
  if (save) {
    save.disabled = !dirty();
    save.onclick = async () => {
      const names = {}; inputs.forEach((i) => { names[i.dataset.speaker] = i.value.trim(); });
      save.disabled = true; save.textContent = "Saving...";
      const r = await api(`/api/meetings/${m.id}/speakers`, { method: "POST", body: JSON.stringify(names) });
      if (r.ok) { toast("Names saved. Updating the minutes..."); await refreshData(true); }
      else { toast((await r.json()).error || "Couldn't save names"); save.textContent = "Save names and update minutes"; save.disabled = false; }
    };
  }
  const ta = $("#mynotes");
  if (ta) ta.oninput = () => {
    m.my_notes = ta.value; $("#mynotes-state").textContent = "Saving...";
    clearTimeout(noteTimer);
    noteTimer = setTimeout(async () => {
      const ok = (await api(`/api/meetings/${m.id}/my_notes`, { method: "PUT", body: ta.value })).ok;
      const st = $("#mynotes-state"); if (st) st.textContent = ok ? "Saved" : "Couldn't save. Is Meeting Notes running?";
    }, 500);
  };
}

// ---------- search across everything
let searchTimer;
$("#q").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    S.query = $("#q").value.trim();
    if (!S.query) { S.results = null; return renderMain(); }
    const r = await api(`/api/search?q=${encodeURIComponent(S.query)}`);
    S.results = r.ok ? await r.json() : [];
    renderSearch();
  }, 250);
});
function renderSearch() {
  const q = S.query, res = S.results || [];
  const hl = (s) => esc(s).replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (x) => `<mark>${x}</mark>`);
  let html = `<div class="page-head"><div><h1>Search</h1><div class="sub">${plural(res.length, "meeting")} mention “${esc(q)}”</div></div></div><div class="results">`;
  for (const r of res) {
    const m = S.meetings.find((x) => x.id === r.id) || {};
    html += `<button class="res" data-open="${r.id}" data-tab="${r.where === "transcript" ? "transcript" : r.where === "my notes" ? "mynotes" : "minutes"}">
      <div class="t">${esc(m.title || "Teams meeting")} <span style="color:var(--muted);font-weight:400">· ${m.date ? esc(fmtShort(m.date)) : ""} · in ${esc(r.where)}</span></div>
      <div class="s">...${hl(r.snippet)}...</div></button>`;
  }
  if (!res.length) html += `<div class="card empty"><b>Nothing found</b>Try another word.</div>`;
  $("#main").innerHTML = html + "</div>";
}

// ===================================================================== shared clicks
document.addEventListener("click", async (e) => {
  const open = e.target.closest("[data-open]");
  if (open) { e.preventDefault(); return openMeeting(open.dataset.open, open.dataset.tab || "minutes"); }
  const ex = e.target.closest("[data-export]");
  if (ex && !ex.disabled) return exportFile(ex.dataset.export, ex.dataset.ids);
});
document.addEventListener("change", async (e) => {
  const cb = e.target.closest("[data-act]"); if (!cb) return;
  const [id, idx] = cb.dataset.act.split(":");
  const m = S.meetings.find((x) => x.id === id); if (!m) return;
  const a = m.actions.find((x) => String(x.i) === idx); a.done = cb.checked;
  if (S.meeting && S.meeting.id === id) { const b = S.meeting.actions.find((x) => String(x.i) === idx); if (b) b.done = cb.checked; }
  await api(`/api/meetings/${id}/actions`, { method: "PUT", body: JSON.stringify({ done: m.actions.filter((x) => x.done).map((x) => x.i) }) });
  if (!S.meetingId) setTimeout(renderOverview, 250); else renderMeeting();
});
async function exportFile(kind, ids) {
  toast(kind === "pdf" ? "Preparing the PDF..." : "Preparing the Word document...");
  const r = await api(`/api/export.${kind}?ids=${encodeURIComponent(ids)}`);
  if (!r.ok) {
    if (kind === "pdf") { const w = window.open(`/print?ids=${encodeURIComponent(ids)}&dialog=1`); if (w) return; }
    return toast("Export failed. Is Meeting Notes running?");
  }
  const cd = r.headers.get("Content-Disposition") || "";
  const name = decodeURIComponent((cd.match(/filename\*=UTF-8''([^;]+)/) || [])[1] || `minutes.${kind}`);
  const url = URL.createObjectURL(await r.blob());
  const a = Object.assign(document.createElement("a"), { href: url, download: name }); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast(`Saved “${name}” to your Downloads.`);
}

// ===================================================================== data + polling
async function refreshData(force = false) {
  try {
    const [st, ms] = await Promise.all([api("/api/status"), api("/api/meetings")]);
    S.status = st.ok ? await st.json() : null;
    const next = ms.ok ? await ms.json() : S.meetings;
    const changed = JSON.stringify(next) !== JSON.stringify(S.meetings);
    S.meetings = next;
    renderStatus();
    if (!changed && !force) return;
    renderCalendar();
    const typing = document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName) && document.activeElement.id !== "q";
    if (typing) return;
    if (S.meetingId) await loadMeeting(); else if (!S.query) renderOverview();
  } catch { S.status = null; renderStatus(); }
}

// ===================================================================== print view (PDF export)
async function renderPrint() {
  document.body.className = "print"; document.body.innerHTML = "";
  const params = new URLSearchParams(location.search);
  const ids = (params.get("ids") || "").split(",").filter(Boolean);
  for (const id of ids) {
    const r = await api(`/api/meetings/${id}`); if (!r.ok) continue;
    const m = await r.json(); if (!m.notes) continue;
    const acts = m.actions || [];
    const div = document.createElement("div"); div.className = "pdoc md";
    div.innerHTML = `<h1>${esc(m.title || "Teams meeting")}</h1>
      <div class="pmeta">${esc(fmtDay(m.date))} · ${m.start}${m.end ? "–" + m.end : ""}${m.duration_min ? " · " + m.duration_min + " min" : ""}</div>
      ${md(minutesBody(m.notes))}
      ${acts.length ? `<h2>Action Items</h2><table><tr><th>#</th><th>Action</th><th>Owner</th><th>Due</th><th>Status</th></tr>${acts.map((a, k) =>
        `<tr><td>${k + 1}</td><td>${inline(esc(a.action))}</td><td>${esc(a.owner)}</td><td>${esc(a.due)}</td><td>${a.done ? "Done" : "Open"}</td></tr>`).join("")}</table>` : ""}
      ${m.my_notes && m.my_notes.trim() ? `<h2>My notes</h2>${m.my_notes.split("\n").map((l) => `<p>${esc(l)}</p>`).join("")}` : ""}`;
    document.body.appendChild(div);
  }
  document.title = "Minutes";
  if (params.get("dialog")) setTimeout(() => window.print(), 300);
}

// ===================================================================== boot
(async () => {
  if (location.pathname === "/print") return renderPrint();
  await refreshData(true);
  const target = S.meetings.find((m) => m.id === location.hash.slice(1));
  if (target) { await openMeeting(target.id); }
  else {
    const today = ymd(new Date());
    if (!S.meetings.some((m) => m.date === today) && S.meetings.length) {
      const last = S.meetings[S.meetings.length - 1].date;
      S.sel = new Set([last]); S.range = null; S.view = parseYmd(last); S.view.setDate(1);
    }
    renderCalendar(); renderOverview();
  }
  setInterval(() => { renderStatus(); }, 1000);
  setInterval(() => refreshData(false), 4000);
})();
</script>
</body>
</html>
